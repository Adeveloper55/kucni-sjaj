# Kućni Sjaj — statički sajt. Dokploy sam dodeljuje domen i TLS.
# Ne dodavati Traefik labele; Dokploy ih ubacuje iz svog interfejsa.

services:
  web:
    build: .
    restart: unless-stopped
    # Nginx sluša port 80 u kontejneru. Dokploy domen vezati za servis web, port 80.
    ports:
      - "80"

