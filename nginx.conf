server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # index.html is the homepage alias written next to index-5.html. Links stay *.html.
    index index.html;

    autoindex off;
    server_tokens off;
    charset utf-8;
    charset_types text/html text/css text/javascript application/javascript application/json application/xml text/plain image/svg+xml;

    # MIME types come from the image's mime.types (html, css, js, images, fonts).
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}
